[project]
name = "submissions-agent"
version = "0.1.0"
description = "MCP server for managing short story submissions"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
    "truststore>=0.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

[project.scripts]
submissions-agent = "src.server:run"
build-profile = "src.profile.builder:main"
run-agent = "src.agent.runner:main"
web-server = "src.web.app:run"
run-evals = "src.evals.cli:main"
rag-index = "src.rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
