# fly.toml — submissions-agent
# Deploy: fly deploy (from the submissions-agent/ directory)
# Docs:   https://fly.io/docs/reference/configuration/

app = "LazyKING"   # CHANGE THIS — must be globally unique on Fly
primary_region = "ord"      # Chicago; change to nearest: iad=Virginia, lax=LA, sea=Seattle

[build]
  dockerfile = "Dockerfile"

[env]
  DEPLOY    = "true"
  WEB_PORT  = "8765"
  AGENT_BACKEND = "claude"

[http_service]
  internal_port = 8765
  force_https   = true
  auto_stop_machines  = false   # keep warm — no cold-start delay for Playwright
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 25
    hard_limit = 50

[[vm]]
  memory   = "1gb"    # Playwright/Chromium needs headroom
  cpu_kind = "shared"
  cpus     = 1

[[mounts]]
  source      = "data"          # created with: fly volumes create data --size 1
  destination = "/app/data"

[checks]
  [checks.health]
    grace_period = "30s"
    interval     = "20s"
    method       = "get"
    path         = "/"
    port         = 8765
    timeout      = "10s"
    type         = "http"
